# ====================================================================
# SELL
# EVERY item in Minecraft can be sold. Items listed under "prices" use
# that price; everything else gets an automatic price (see default-price).
# Enchanted, renamed and armor-trimmed items sell too.
# Prices are per ONE item. After editing, run /sell reload.
# Check any item with /sell worth while holding it.
# ====================================================================

currency-symbol: "$"

# Tools/armor sell for less the more damaged they are.
scale-by-durability: true

# Price used for any item that isn't in "prices" and doesn't match an
# automatic category (spawn eggs, discs, wool, wood, tools, etc.).
default-price: 2

# Can items with a custom name or lore be sold? (true = sold at normal value)
allow-renamed-items: true

# Items nobody can sell. Empty = literally everything is sellable.
# Example: blacklist: [BEDROCK, BARRIER, COMMAND_BLOCK]
blacklist: []

# Each enchantment adds (value x level) to an item's price.
# Anything not listed here uses default-enchant-value per level.
default-enchant-value: 300
enchant-values:
  mending: 5000
  unbreaking: 800
  protection: 800
  fire_protection: 300
  blast_protection: 300
  projectile_protection: 300
  feather_falling: 400
  thorns: 400
  respiration: 400
  aqua_affinity: 1200
  depth_strider: 400
  frost_walker: 600
  soul_speed: 800
  swift_sneak: 1500
  binding_curse: 10
  vanishing_curse: 10
  sharpness: 600
  smite: 250
  bane_of_arthropods: 250
  knockback: 300
  fire_aspect: 400
  looting: 800
  sweeping_edge: 400
  efficiency: 600
  silk_touch: 2500
  fortune: 1200
  power: 600
  punch: 300
  flame: 1000
  infinity: 3000
  luck_of_the_sea: 300
  lure: 300
  loyalty: 500
  impaling: 300
  riptide: 500
  channeling: 1000
  multishot: 1000
  piercing: 300
  quick_charge: 400
  density: 800
  breach: 800
  wind_burst: 1200

messages:
  sold: "&6&lSell &r>> &aYou sold your items for &2{amount}&a!"
  nothing: "&6&lSell &r>> &cThere is nothing to sell!"
  unsellable: "&6&lSell &r>> &cYou can't sell &f{item} &c({reason})"
  no-economy: "&6&lSell &r>> &cNo economy found. Install Vault + an economy plugin."

