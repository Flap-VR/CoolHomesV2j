# --------------------------------------------------------------------
# Special items: enchantments and armor trims
#   materials:    exact names, or wildcards (NETHERITE_* / *_HELMET)
#   enchants:     minimum levels required (use minecraft names, lowercase)
#   trim-pattern / trim-material: optional, lowercase (silence, netherite...)
#   price:        what ONE item sells for
# Rules are PREMIUMS: if an item matches a rule, it sells for whichever is
# higher - the rule's price or its normal (base + enchantment) value.
# Items matching no rule still sell using the enchantment values above.
# --------------------------------------------------------------------
